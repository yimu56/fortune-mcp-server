# Fortune 记账 MCP Server —— nginx 反向代理参考配置
# 用途：给企业版连接器一个 HTTPS + 域名的入口（平台侧通常要求 https）。
# 用法：
#   sudo cp deploy/nginx-fortune-mcp.conf /etc/nginx/conf.d/
#   sudo vi /etc/nginx/conf.d/nginx-fortune-mcp.conf   # 改 server_name 与证书路径
#   sudo nginx -t && sudo systemctl reload nginx

upstream fortune_mcp {
    server 127.0.0.1:18088;
    keepalive 32;
}

server {
    listen 80;
    server_name fortune-mcp.example.com;
    # 强制跳 HTTPS（证书就绪后启用）
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;                      # nginx < 1.25 请改成 listen 443 ssl http2;
    server_name fortune-mcp.example.com;

    ssl_certificate     /etc/nginx/ssl/fortune-mcp.crt;
    ssl_certificate_key /etc/nginx/ssl/fortune-mcp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 请求体很小（JSON-RPC），限制一下更安全
    client_max_body_size 1m;

    location / {
        proxy_pass http://fortune_mcp;
        proxy_http_version 1.1;

        # 关键：保持长连接 / 关闭缓冲，保证 SSE 与 Streamable HTTP 正常
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # 健康检查可不鉴权，便于监控探活
    location = /healthz {
        proxy_pass http://fortune_mcp/healthz;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }
}
